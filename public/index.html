<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TELLO.KZ — маркетплейс смартфонов</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap');
:root{--bg:#f5f6f8;--card:#fff;--text:#111318;--muted:#737985;--line:#e6e8ec;--soft:#f0f1f4}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Manrope,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}.wrap{max-width:1240px;margin:auto;padding:0 22px}
header{position:sticky;top:0;z-index:20;background:#ffffffed;backdrop-filter:blur(16px);border-bottom:1px solid var(--line)}nav{height:72px;display:flex;align-items:center;justify-content:space-between}.logo{font:700 28px "Space Grotesk";letter-spacing:-1.5px}.logo span{color:#8b9098}.links{display:flex;gap:5px}.links button,.right button{border:0;background:transparent;padding:10px 13px;border-radius:12px;font-weight:800}.links button:hover,.right button:hover{background:var(--soft)}.dark{background:#111318!important;color:#fff!important}.hero{padding:40px 0 24px}.heroBox{background:#111318;color:#fff;border-radius:28px;padding:38px;display:grid;grid-template-columns:1.3fr .7fr;gap:25px}.eyebrow{font-size:11px;font-weight:800;letter-spacing:1.8px;text-transform:uppercase;color:#969ca6}.hero h1{font:700 clamp(40px,5vw,67px)/.95 "Space Grotesk";letter-spacing:-3px;margin:12px 0}.hero p{color:#b9bec7;max-width:650px;line-height:1.6}.search{display:flex;background:#fff;padding:7px;border-radius:15px;margin-top:22px}.search input{border:0;outline:0;flex:1;padding:12px}.search button{background:#111;color:#fff;border:0;border-radius:10px;padding:12px 17px;font-weight:800}.heroStats{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stat{background:#ffffff0d;border:1px solid #ffffff14;border-radius:18px;padding:20px}.num{font:700 37px "Space Grotesk"}.catalog{padding:24px 0 60px}.title{display:flex;justify-content:space-between;align-items:end;margin-bottom:15px}.title h2{font:700 30px "Space Grotesk";margin:5px 0;letter-spacing:-1px}.filters{background:#fff;border:1px solid var(--line);border-radius:18px;padding:13px;display:grid;grid-template-columns:repeat(7,1fr);gap:8px;margin-bottom:18px}.filters select,.filters input{border:1px solid var(--line);border-radius:11px;padding:10px;background:#fafbfc;outline:0}.filters button{border:0;border-radius:11px;background:var(--soft);font-weight:800}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.card{background:#fff;border:1px solid var(--line);border-radius:19px;overflow:hidden;position:relative}.pic{height:180px;background:linear-gradient(140deg,#eef0f3,#fff);display:grid;place-items:center;font-size:72px}.fav{position:absolute;right:10px;top:10px;width:37px;height:37px;border:0;border-radius:50%;background:#ffffffdd;font-size:18px}.body{padding:14px}.brand{font-size:10px;letter-spacing:1px;text-transform:uppercase;color:#8b9098;font-weight:800}.model{font:700 18px "Space Grotesk";margin:4px 0}.price{font-size:20px;font-weight:800}.meta{display:flex;justify-content:space-between;color:#7b818b;font-size:12px;margin-top:7px}.open{margin-top:12px;width:100%;padding:11px;border:0;border-radius:11px;background:#111318;color:#fff;font-weight:800}
.overlay{display:none;position:fixed;inset:0;background:#0008;z-index:100;padding:20px;align-items:center;justify-content:center}.overlay.show{display:flex}.modal{width:min(980px,100%);max-height:92vh;overflow:auto;background:#fff;border-radius:25px;padding:25px;position:relative}.x{position:absolute;right:16px;top:16px;width:38px;height:38px;border:0;border-radius:50%;background:var(--soft);font-size:20px}.cab{display:grid;grid-template-columns:230px 1fr;gap:20px}.side{background:#111318;color:#fff;border-radius:20px;padding:18px}.avatar{width:58px;height:58px;background:#fff;color:#111;border-radius:18px;display:grid;place-items:center;font-size:23px;font-weight:800}.side button{display:block;width:100%;text-align:left;border:0;background:transparent;color:#ccc;padding:11px;border-radius:10px;margin-top:5px}.side button:hover,.side .active{background:#ffffff14;color:#fff}.dash{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.box{border:1px solid var(--line);border-radius:15px;padding:15px}.box b{font:700 27px "Space Grotesk"}.form{display:grid;gap:10px}.form input,.form select,.form textarea{border:1px solid var(--line);padding:12px;border-radius:11px;outline:0}.primary{border:0;background:#111;color:#fff;padding:13px;border-radius:11px;font-weight:800}.secondary{border:0;background:var(--soft);padding:12px;border-radius:11px;font-weight:800}.row{border:1px solid var(--line);border-radius:14px;padding:13px;display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:8px}.empty{text-align:center;padding:35px;color:#777;border:1px dashed #d6d9df;border-radius:15px}.toast{position:fixed;bottom:18px;right:18px;background:#111;color:#fff;padding:13px 16px;border-radius:12px;display:none;z-index:200}.toast.on{display:block}
@media(max-width:1000px){.grid{grid-template-columns:repeat(3,1fr)}.filters{grid-template-columns:repeat(4,1fr)}.heroBox{grid-template-columns:1fr}}@media(max-width:650px){.wrap{padding:0 14px}.links{display:none}.heroBox{padding:25px;border-radius:22px}.hero h1{letter-spacing:-2px}.grid{grid-template-columns:repeat(2,1fr)}.filters{grid-template-columns:1fr 1fr}.cab{grid-template-columns:1fr}.dash{grid-template-columns:1fr}.pic{height:145px;font-size:58px}}
</style></head><body>
<header><div class="wrap"><nav><div class="logo">TELLO<span>.KZ</span></div><div class="links"><button onclick="go()">Каталог</button><button onclick="favorites()">♡ Избранное</button></div><div class="right"><button onclick="auth()">Войти</button><button class="dark" onclick="cabinet()">Личный кабинет</button></div></nav></div></header>
<main><section class="hero"><div class="wrap"><div class="heroBox"><div><div class="eyebrow">Маркетплейс смартфонов Казахстана</div><h1>Найди телефон.<br>Продай телефон.</h1><p>Настоящие объявления пользователей, удобный поиск, избранное и безопасный контакт с продавцом.</p><div class="search"><input id="q" placeholder="Например, iPhone 15 Pro Max"><button onclick="go()">Найти</button></div></div><div class="heroStats"><div class="stat"><div class="eyebrow">Города</div><div class="num">31</div><span>по Казахстану</span></div><div class="stat"><div class="eyebrow">Модели</div><div class="num">79+</div><span>в каталоге</span></div><div class="stat" style="grid-column:span 2"><div class="eyebrow">Продавец</div><b>Добавь объявление бесплатно</b><br><button class="secondary" style="margin-top:10px" onclick="add()">+ Разместить</button></div></div></div></div></section>
<section class="catalog" id="catalog"><div class="wrap"><div class="title"><div><div class="eyebrow" style="color:#8b9098">ЖИВЫЕ ОБЪЯВЛЕНИЯ</div><h2>Каталог</h2></div><span id="count" class="eyebrow" style="color:#777"></span></div>
<div class="filters"><select id="city"><option value="">Город</option></select><select id="brand"><option value="">Бренд</option></select><select id="model"><option value="">Модель</option></select><select id="memory"><option value="">Память</option><option>64 ГБ</option><option>128 ГБ</option><option>256 ГБ</option><option>512 ГБ</option><option>1 ТБ</option></select><select id="condition"><option value="">Состояние</option><option>Новый</option><option>Как новый</option><option>Хорошее</option></select><input id="min" type="number" placeholder="От"><input id="max" type="number" placeholder="До"><button onclick="reset()">Сброс</button></div>
<div class="grid" id="grid"></div></div></section></main><div class="overlay" id="ov"><div class="modal" id="mb"></div></div><div class="toast" id="toast"></div>
<script>
let CAT={cities:[],models:{}},token=localStorage.getItem("tello_token")||"",me=null;
const $=id=>document.getElementById(id); const api=async(u,o={})=>{o.headers={...(o.headers||{}),...(token?{Authorization:"Bearer "+token}:{})};let r=await fetch(u,o),d=await r.json();if(!r.ok)throw Error(d.error||"Ошибка");return d};
async function init(){CAT=await api("/api/catalog");city.innerHTML='<option value="">Город</option>'+CAT.cities.map(x=>`<option>${x}</option>`).join("");brand.innerHTML='<option value="">Бренд</option>'+Object.keys(CAT.models).map(x=>`<option>${x}</option>`).join("");brand.onchange=()=>{model.innerHTML='<option value="">Модель</option>'+(CAT.models[brand.value]||Object.values(CAT.models).flat()).map(x=>`<option>${x}</option>`).join("");load()};["city","model","memory","condition","min","max"].forEach(x=>$(x).onchange=load);q.oninput=load;load()}
async function load(){let p=new URLSearchParams();for(let x of ["city","brand","model","memory","condition","min","max"]){if($(x).value)p.set(x,$(x).value)}if(q.value)p.set("q",q.value);let a=await api("/api/listings?"+p);count.textContent=a.length+" объявлений";grid.innerHTML=a.length?a.map(card).join(""):'<div class="empty" style="grid-column:1/-1">Пока нет реальных объявлений.<br>Стань первым продавцом на TELLO.</div>'}
function card(x){return `<article class="card"><button class="fav" onclick="fav(${x.id})">♡</button><div class="pic">📱</div><div class="body"><div class="brand">${x.brand}</div><div class="model">${x.model}</div><div class="price">${x.price.toLocaleString("ru-RU")} ₸</div><div class="meta"><span>${x.memory}</span><span>${x.condition}</span></div><div class="meta"><span>📍 ${x.city}</span><span>${x.seller}</span></div><button class="open" onclick="listing(${x.id})">Подробнее</button></div></article>`}
async function listing(id){let x=await api("/api/listings/"+id);show(`<button class="x" onclick="closeM()">×</button><div style="display:grid;grid-template-columns:1fr 1fr;gap:20px"><div class="pic" style="height:360px;border-radius:18px">📱</div><div><div class="brand">${x.brand}</div><h2 style="font:700 30px 'Space Grotesk'">${x.model}</h2><div class="price">${x.price.toLocaleString("ru-RU")} ₸</div><p class="muted">${x.memory} · ${x.condition} · 📍 ${x.city}</p><p>${x.description||"Продавец не добавил описание."}</p><button class="primary" onclick="contact(${x.seller_id},${x.id})">💬 Написать продавцу</button><button class="secondary" style="width:100%;margin-top:8px" onclick="fav(${x.id})">♡ Сохранить</button></div></div>`)}
async function fav(id){if(!token){auth();return}await api("/api/favorites/"+id,{method:"POST"});toast("Избранное обновлено")}
async function contact(receiver,listing){if(!token){auth();return}show(`<button class="x" onclick="closeM()">×</button><h2>Написать продавцу</h2><div class="form"><textarea id="msg" placeholder="Ваше сообщение"></textarea><button class="primary" onclick="sendMsg(${receiver},${listing})">Отправить</button></div>`)}
async function sendMsg(r,l){if(!msg.value.trim())return toast("Напиши сообщение");await api("/api/messages",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({receiver_id:r,listing_id:l,text:msg.value})});closeM();toast("Сообщение отправлено")}
function auth(){show(`<button class="x" onclick="closeM()">×</button><h2>${token?"Аккаунт TELLO":"Войти в TELLO"}</h2>${token?'<p>Вы вошли в аккаунт.</p><button class="secondary" onclick="logout()">Выйти</button>':'<div class="form"><input id="an" placeholder="Имя"><input id="ae" type="email" placeholder="Email"><input id="ap" type="password" placeholder="Пароль"><button class="primary" onclick="login()">Войти / зарегистрироваться</button></div>'}`)}
async function login(){try{let d;try{d=await api("/api/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({email:ae.value,password:ap.value})})}catch(e){d=await api("/api/register",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({name:an.value,email:ae.value,password:ap.value})})}token=d.token;localStorage.setItem("tello_token",token);me=d.user;closeM();toast("Добро пожаловать");}catch(e){toast(e.message)}}
function logout(){token="";me=null;localStorage.removeItem("tello_token");closeM();toast("Вы вышли")}
async function cabinet(){if(!token){auth();return}let u=await api("/api/me"),ls=await api("/api/me/listings"),ms=await api("/api/messages"),fs=await api("/api/favorites");show(`<div class="cab"><aside class="side"><div class="avatar">${u.name[0].toUpperCase()}</div><b>${u.name}</b><div style="font-size:12px;color:#999;margin:4px 0 18px">${u.email}</div><button class="active">Обзор</button><button onclick="myListings()">Мои объявления</button><button onclick="messages()">Сообщения</button><button onclick="favorites()">Избранное</button><button onclick="add()">+ Добавить объявление</button><button onclick="logout()">Выйти</button></aside><section><h2 style="font:700 30px 'Space Grotesk'">Личный кабинет</h2><div class="dash"><div class="box">Объявления<br><b>${ls.length}</b></div><div class="box">Избранное<br><b>${fs.length}</b></div><div class="box">Сообщения<br><b>${ms.length}</b></div></div><div style="margin-top:14px"><button class="primary" onclick="add()">+ Разместить объявление</button></div></section></div>`)}
async function myListings(){let ls=await api("/api/me/listings");show(`<button class="x" onclick="cabinet()">×</button><h2 style="font:700 30px 'Space Grotesk'">Мои объявления</h2>${ls.length?ls.map(x=>`<div class="row"><div><b>${x.brand} ${x.model}</b><div style="font-size:12px;color:#777">${x.price.toLocaleString("ru-RU")} ₸ · ${x.city}</div></div><button class="secondary" onclick="del(${x.id})">Удалить</button></div>`).join(""):'<div class="empty">У тебя пока нет объявлений.</div>'}`)}
async function del(id){await api("/api/listings/"+id,{method:"DELETE"});myListings();load();toast("Объявление удалено")}
async function messages(){let ms=await api("/api/messages");show(`<button class="x" onclick="cabinet()">×</button><h2 style="font:700 30px 'Space Grotesk'">Сообщения</h2>${ms.length?ms.map(x=>`<div class="row"><div><b>${x.sender}</b><div>${x.text}</div></div><span style="font-size:12px;color:#777">${x.created_at}</span></div>`).join(""):'<div class="empty">Сообщений пока нет.</div>'}`)}
async function favorites(){if(!token){auth();return}let fs=await api("/api/favorites");show(`<button class="x" onclick="closeM()">×</button><h2 style="font:700 30px 'Space Grotesk'">Избранное</h2>${fs.length?fs.map(x=>`<div class="row"><div><b>${x.brand} ${x.model}</b><div style="font-size:12px;color:#777">${x.price.toLocaleString("ru-RU")} ₸ · ${x.city}</div></div><button class="secondary" onclick="listing(${x.id})">Открыть</button></div>`).join(""):'<div class="empty">Избранное пусто.</div>'}`)}
function add(){if(!token){auth();return}show(`<button class="x" onclick="closeM()">×</button><h2 style="font:700 30px 'Space Grotesk'">Новое объявление</h2><form class="form" id="af"><select name="brand" id="ab"><option value="">Бренд</option>${Object.keys(CAT.models).map(x=>`<option>${x}</option>`).join("")}</select><select name="model" id="am"><option>Выберите бренд</option></select><select name="city">${CAT.cities.map(x=>`<option>${x}</option>`).join("")}</select><select name="memory"><option>128 ГБ</option><option>256 ГБ</option><option>512 ГБ</option><option>1 ТБ</option></select><select name="condition"><option>Новый</option><option>Как новый</option><option>Хорошее</option></select><input name="price" type="number" placeholder="Цена, ₸"><input name="description" placeholder="Описание"><input name="photo" type="file" accept="image/*"><button class="primary">Опубликовать</button></form>`);ab.onchange=()=>am.innerHTML=(CAT.models[ab.value]||[]).map(x=>`<option>${x}</option>`).join("");af.onsubmit=async e=>{e.preventDefault();let r=await fetch("/api/listings",{method:"POST",headers:{Authorization:"Bearer "+token},body:new FormData(af)}),d=await r.json();if(!r.ok)return toast(d.error||"Ошибка");closeM();load();toast("Объявление опубликовано")}}
function reset(){["city","brand","model","memory","condition","min","max"].forEach(x=>$(x).value="");model.innerHTML='<option value="">Модель</option>';load()}
function go(){$("catalog").scrollIntoView({behavior:"smooth"});load()}
function show(x){mb.innerHTML=x;ov.classList.add("show")}function closeM(){ov.classList.remove("show")}function toast(t){let x=$("toast");x.textContent=t;x.classList.add("on");setTimeout(()=>x.classList.remove("on"),2200)}
init();
</script></body></html>
